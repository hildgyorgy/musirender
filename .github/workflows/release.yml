name: Publish MusiRender DMG

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    runs-on: macos-26
    timeout-minutes: 55
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-build\.([1-9][0-9]*))?$ ]]; then
            echo "::error::Release tags must look like v0.2.0 or v0.2.0-build.3"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[3]}"
          release_title="MusiRender $version"
          if [[ -n "$build_number" ]]; then
            release_title="$release_title (build $build_number)"
          fi
          {
            printf 'RELEASE_VERSION=%s\n' "$version"
            printf 'RELEASE_BUILD_NUMBER=%s\n' "$build_number"
            printf 'RELEASE_TITLE=%s\n' "$release_title"
            printf 'DMG_FILENAME=MusiRender-%s.dmg\n' "${RELEASE_TAG#v}"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Test and build the tagged version
        shell: bash
        run: |
          [[ "$(uname -m)" == arm64 ]]
          work="$RUNNER_TEMP/musirender-release"
          mkdir -p "$work"
          xcodebuild -version
          swift test --scratch-path "$work/swift-tests"
          xcodebuild -project MusiRenderer.xcodeproj -scheme MusiRenderer \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath "$work/build" CODE_SIGNING_ALLOWED=NO build

          app="$work/build/Build/Products/Release/MusiRender.app"
          plist="$app/Contents/Info.plist"
          app_version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")
          if [[ "$app_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match app version $app_version"
            exit 1
          fi
          app_build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")
          if [[ -n "$RELEASE_BUILD_NUMBER" && "$RELEASE_BUILD_NUMBER" != "$app_build" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match app build number $app_build"
            exit 1
          fi
          [[ "$(lipo -archs "$app/Contents/MacOS/MusiRender")" == arm64 ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$plist")" == 26.0 ]]

      - name: Sign, notarize and verify the DMG
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret $name"
              exit 1
            fi
          done

          work="$RUNNER_TEMP/musirender-release"
          keychain="$work/signing.keychain-db"
          certificate="$work/signing.p12"
          mountpoint="$work/verify"
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then hdiutil detach "$mountpoint" -quiet || true; fi
            security delete-keychain "$keychain" || true
            rm -f "$certificate"
          }
          trap cleanup EXIT
          umask 077
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate"
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -f pkcs12 -t cert -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$certificate"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk '/"Developer ID Application:/ { print $2 }')
          if [[ ! "$identity" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "::error::The P12 must contain one valid Developer ID Application identity and its private key"
            exit 1
          fi

          app="$work/build/Build/Products/Release/MusiRender.app"
          codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          team=$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          [[ "$team" =~ ^[A-Z0-9]{10}$ ]]
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$team")

          notarize() {
            local file="$1" report="$2" submission
            printf 'Submitting %s for notarization\n' "$(basename "$file")"
            if xcrun notarytool submit "$file" "${auth[@]}" --wait --timeout 20m --output-format json > "$report" &&
               [[ "$(plutil -extract status raw -o - "$report")" == Accepted ]]; then
              printf 'Apple accepted %s\n' "$(basename "$file")"
              return
            fi
            cat "$report"
            submission=$(plutil -extract id raw -o - "$report" 2>/dev/null || true)
            if [[ -n "$submission" ]]; then xcrun notarytool log "$submission" "${auth[@]}" || true; fi
            return 1
          }

          ditto -c -k --keepParent "$app" "$work/MusiRender.zip"
          notarize "$work/MusiRender.zip" "$work/app-notary.json"
          xcrun stapler staple "$app"

          image_root="$work/image"
          mkdir "$image_root" "$mountpoint"
          ditto "$app" "$image_root/MusiRender.app"
          ln -s /Applications "$image_root/Applications"
          notes="docs/RELEASE_${RELEASE_VERSION}.md"
          if [[ -f "$notes" ]]; then
            sed -E 's/^#{1,2} //; s/`//g' "$notes" > "$image_root/Release Notes.txt"
          else
            printf '%s\n\nRequires Apple silicon and macOS 26 or later.\nDrag MusiRender.app into Applications.\n' "$RELEASE_TITLE" > "$image_root/Release Notes.txt"
          fi

          dmg="$work/$DMG_FILENAME"
          hdiutil create -quiet -volname "$RELEASE_TITLE" -fs HFS+ -format UDZO -srcfolder "$image_root" "$dmg"
          codesign --timestamp --keychain "$keychain" --sign "$identity" \
            --identifier org.musirenderer.MusiRender.diskimage "$dmg"
          notarize "$dmg" "$work/dmg-notary.json"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint" -quiet
          mounted=true
          xcrun stapler validate "$mountpoint/MusiRender.app"
          syspolicy_check distribution "$mountpoint/MusiRender.app"
          [[ "$(readlink "$mountpoint/Applications")" == /Applications ]]
          cmp "$mountpoint/Release Notes.txt" "$image_root/Release Notes.txt"

      - name: Publish the verified installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="$RUNNER_TEMP/musirender-release/$DMG_FILENAME"
          notes="docs/RELEASE_${RELEASE_VERSION}.md"
          if [[ -f "$notes" ]]; then
            release_notes=(--notes-file "$notes")
          else
            release_notes=(--generate-notes)
          fi
          release_options=()
          if [[ -n "$RELEASE_BUILD_NUMBER" ]]; then
            release_options+=(--latest)
          fi
          gh release create "$RELEASE_TAG" "$dmg" --verify-tag \
            --title "$RELEASE_TITLE" "${release_notes[@]}" "${release_options[@]}"
